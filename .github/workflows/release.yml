name: Release

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload to GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: "pnpm"

      - name: Read version from package.json
        run: |
          VERSION=$(node -p "require('./apps/work/package.json').version")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Mac App (arm64)
        run: |
          cd apps/work
          pnpm run make:mac:arm64
          APP_PATH="out/Willow-darwin-arm64/Willow.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          if test -z "${WILLOW_MACOS_SIGN_IDENTITY:-}"; then
            if codesign -dv --verbose=4 "$APP_PATH/Contents/MacOS/Willow" 2>&1 \
              | grep -q 'flags=.*runtime'; then
              echo "Ad-hoc builds must not enable Hardened Runtime"
              exit 1
            fi
            if codesign -dv --verbose=4 \
              "$APP_PATH/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" \
              2>&1 | grep -q 'flags=.*runtime'; then
              echo "Ad-hoc Electron Framework must not enable Hardened Runtime"
              exit 1
            fi
          fi
          mv out/make/Willow\ Work.dmg out/make/Willow-Work-${{ env.VERSION }}-arm64.dmg || true
          APP_ASAR=$(find out -path "*darwin-arm64*/Contents/Resources/app.asar" -type f -print -quit)
          test -n "$APP_ASAR"
          test -d "${APP_ASAR}.unpacked"
          rm -rf out/app-arm64.asar.unpacked
          cp "$APP_ASAR" out/app-arm64.asar
          cp -R "${APP_ASAR}.unpacked" out/app-arm64.asar.unpacked
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WILLOW_MACOS_SIGN_IDENTITY: ${{ secrets.WILLOW_MACOS_SIGN_IDENTITY }}

      # Separate Forge/Vite builds can produce different content-hashed renderer filenames.
      # Build the native-free hot-update ASAR from the single supported architecture instead
      # of comparing independently generated renderer directories byte-for-byte.
      - name: Prepare native-free arm64 app.asar hot update
        run: |
          cd apps/work
          test -f out/app-arm64.asar
          test -d out/app-arm64.asar.unpacked
          TEMP_ASAR_DIR=$(mktemp -d)
          UNPACKED_ASAR_DIR="$PWD/out/app-arm64.asar.unpacked"
          trap 'rm -rf "$TEMP_ASAR_DIR" "$UNPACKED_ASAR_DIR"' EXIT
          pnpm exec asar extract out/app-arm64.asar "$TEMP_ASAR_DIR"
          rm -rf "$TEMP_ASAR_DIR/node_modules/better-sqlite3/build"
          rm -rf "$TEMP_ASAR_DIR/node_modules/better-sqlite3/bin"
          find "$TEMP_ASAR_DIR" -name '*.node' -delete
          find "$TEMP_ASAR_DIR" -type l -delete
          find "$TEMP_ASAR_DIR" -depth -type d -empty -delete
          test -f "$TEMP_ASAR_DIR/.vite/build/main.js"
          test -f "$TEMP_ASAR_DIR/.vite/build/preload.js"
          test -f "$TEMP_ASAR_DIR/src/main/db/migrations/meta/_journal.json"
          test -n "$(find "$TEMP_ASAR_DIR/resources/skills" -name SKILL.md -print -quit)"
          ASAR_VERSION=$(node -p "require('$TEMP_ASAR_DIR/package.json').version")
          test "v$ASAR_VERSION" = "${{ env.VERSION }}"
          pnpm exec asar pack "$TEMP_ASAR_DIR" "out/app-${{ env.VERSION }}.asar"
          if pnpm exec asar list "out/app-${{ env.VERSION }}.asar" | grep -q '\.node$'; then
            echo "Native modules must not be included in the hot-update ASAR"
            exit 1
          fi
          shasum -a 256 "out/app-${{ env.VERSION }}.asar" \
            > "out/app-${{ env.VERSION }}.asar.sha256"

      - name: Check output files
        run: |
          ls -la apps/work/out/make/ || true
          ls -la apps/work/out/make/zip/darwin/arm64/ || true

      - name: Upload Packaged Artifacts to Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: willow-build-${{ env.VERSION }}
          path: |
            apps/work/out/make/*.dmg
            apps/work/out/make/zip/darwin/arm64/*.zip
            apps/work/out/app-${{ env.VERSION }}.asar
            apps/work/out/app-${{ env.VERSION }}.asar.sha256

      - name: Create Release and Upload Assets
        if: ${{ inputs.upload_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: |
            apps/work/out/make/*.dmg
            apps/work/out/make/zip/darwin/arm64/*.zip
            apps/work/out/app-${{ env.VERSION }}.asar
            apps/work/out/app-${{ env.VERSION }}.asar.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        if: ${{ inputs.upload_release == true }}
        run: |
          sleep 5
          mkdir -p dist-pages
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/LeoLun/willow/releases/latest \
               -o dist-pages/latest.json
          node -e "const data = require('./dist-pages/latest.json'); if(!data.tag_name) throw new Error('Invalid JSON generated');"
          node -e "const data = require('./dist-pages/latest.json'); const base='app-' + data.tag_name + '.asar'; const names=new Set(data.assets.map(a=>a.name)); if(!names.has(base)||!names.has(base+'.sha256')) throw new Error('Hot update assets are missing');"

      - name: Deploy to GitHub Pages
        if: ${{ inputs.upload_release == true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-pages
          publish_branch: gh-pages
          destination_dir: .
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: update latest.json to ${{ env.VERSION }}"
