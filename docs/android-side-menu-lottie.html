<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Android Side Menu Lottie</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        background: #f5f6f8;
        color: #667085;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f5f6f8;
      }

      .stage {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .menu-button {
        width: 96px;
        height: 96px;
        padding: 0;
        border: 0;
        border-radius: 24px;
        background: #ffffff;
        display: grid;
        place-items: center;
        box-shadow:
          0 12px 32px rgb(15 23 42 / 12%),
          inset 0 0 0 1px rgb(15 23 42 / 6%);
        cursor: pointer;
        transition: transform 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-button:hover {
        transform: translateY(-1px);
      }

      .menu-button:active {
        transform: scale(0.97);
      }

      #lottie-icon {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .label {
        margin: 0;
        color: #667085;
        font-size: 14px;
        letter-spacing: 0;
        user-select: none;
      }

      .menu-button:focus-visible {
        outline: 3px solid #6096ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <button class="menu-button" type="button" aria-label="切换菜单图标">
        <span id="lottie-icon" aria-hidden="true"></span>
      </button>
      <p class="label">点击图标切换动画</p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
      const DURATION_FRAMES = 50;
      const OPEN_SPEED = 1.34;
      const CLOSE_SPEED = 1.34;

      const shape = (from, to) => ({
        i: [
          [0, 0],
          [0, 0],
        ],
        o: [
          [0, 0],
          [0, 0],
        ],
        v: [from, to],
        c: false,
      });

      const linePath = (from, to, endFrom, endTo) => ({
        ty: "sh",
        ks: {
          a: 1,
          k: [
            {
              t: 0,
              s: [shape(from, to)],
              e: [shape(endFrom, endTo)],
              i: { x: [0.2], y: [1] },
              o: { x: [0.18], y: [0] },
            },
            { t: DURATION_FRAMES, s: [shape(endFrom, endTo)] },
          ],
        },
      });

      const stroke = {
        ty: "st",
        c: { a: 0, k: [0.086, 0.102, 0.122, 1] },
        o: { a: 0, k: 100 },
        w: { a: 0, k: 8 },
        lc: 2,
        lj: 2,
        ml: 4,
      };

      const rotation = (start, end) => ({
        a: 1,
        k: [
          {
            t: 0,
            s: [start],
            e: [end],
            i: { x: [0.2], y: [1] },
            o: { x: [0.18], y: [0] },
          },
          { t: DURATION_FRAMES, s: [end] },
        ],
      });

      const transform = (rotateFrom, rotateTo) => ({
        ty: "tr",
        p: { a: 0, k: [80, 80] },
        a: { a: 0, k: [0, 0] },
        s: { a: 0, k: [100, 100] },
        r: rotation(rotateFrom, rotateTo),
        o: { a: 0, k: 100 },
        sk: { a: 0, k: 0 },
        sa: { a: 0, k: 0 },
      });

      const animationData = {
        v: "5.12.2",
        fr: 60,
        ip: 0,
        op: DURATION_FRAMES + 1,
        w: 160,
        h: 160,
        nm: "Android side menu to right arrow",
        ddd: 0,
        assets: [],
        layers: [
          {
            ddd: 0,
            ind: 1,
            ty: 4,
            nm: "three-shared-lines",
            sr: 1,
            ks: {
              o: { a: 0, k: 100 },
              r: { a: 0, k: 0 },
              p: { a: 0, k: [0, 0, 0] },
              a: { a: 0, k: [0, 0, 0] },
              s: { a: 0, k: [100, 100, 100] },
            },
            ao: 0,
            shapes: [
              {
                ty: "gr",
                nm: "hamburger-to-arrow-group",
                it: [
                  linePath([-30, -18], [30, -18], [6, -24], [31, 0]),
                  linePath([-30, 0], [30, 0], [-31, 0], [31, 0]),
                  linePath([-30, 18], [30, 18], [6, 24], [31, 0]),
                  stroke,
                  transform(0, -360),
                ],
              },
            ],
            ip: 0,
            op: DURATION_FRAMES + 1,
            st: 0,
            bm: 0,
          },
        ],
      };

      const icon = lottie.loadAnimation({
        container: document.getElementById("lottie-icon"),
        renderer: "svg",
        loop: false,
        autoplay: false,
        animationData,
        rendererSettings: {
          preserveAspectRatio: "xMidYMid meet",
        },
      });

      let open = false;
      const button = document.querySelector(".menu-button");

      icon.goToAndStop(0, true);

      button.addEventListener("click", () => {
        open = !open;
        icon.setDirection(open ? 1 : -1);
        icon.setSpeed(open ? OPEN_SPEED : CLOSE_SPEED);
        icon.play();
      });
    </script>
  </body>
</html>
